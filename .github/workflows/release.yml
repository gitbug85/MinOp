name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install Nim
      - name: Setup Nim
        uses: iffy/install-nim@v5
        with:
          version: stable

      # Install Rust/rustc/cargo
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Compile Nim
      - name: Compile minop.nim
        run: |
          nim c ./src/minop.nim

      # Run build script
      - name: Run build script
        run: bash ./src/scripts/build.sh

      # Collect extensionless files and .a files
      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          find . -maxdepth 1 -type f \
            \( ! -name '*.*' -o -name '*.a' \) \
            -exec cp {} release/ \;

          echo "Release contents:"
          find release -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create compressed Linux archive
        run: |
          tar -czf "/tmp/minop-${GITHUB_REF_NAME}-linux.tar.gz" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="*.zip" \
            .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "${GITHUB_REF_NAME}" \
            "/tmp/minop-${GITHUB_REF_NAME}-linux.tar.gz" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
